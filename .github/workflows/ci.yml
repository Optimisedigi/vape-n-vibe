name: CI Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile whisper.cpp binary
        run: make -j$(sysctl -n hw.logicalcpu) main
        working-directory: node_modules/whisper-node/lib/whisper.cpp

      - name: Lint & format check
        run: |
          npm run lint
          npm run format:check

      - name: Select Xcode 26 (macOS 26 SDK for the Apple speech helper)
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [[ -z "$XCODE" ]]; then
            echo "::error::No Xcode 26 on this runner — the Apple speech helper needs the macOS 26 SDK"
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcrun swiftc --version

      - name: Build Apple speech helper
        run: bash scripts/build-apple-speech.sh

      - name: Build unpacked app
        run: npx electron-builder --mac --arm64 --dir --publish never -c.mac.notarize=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Run smoke tests
        run: bash scripts/smoke-test.sh mac

  smoke-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile whisper.cpp binary
        shell: bash
        run: |
          cd node_modules/whisper-node/lib/whisper.cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target main
          cp build/bin/Release/main.exe . 2>/dev/null || cp build/bin/main.exe . 2>/dev/null || true
          cp build/bin/Release/whisper.dll . 2>/dev/null || cp build/bin/whisper.dll . 2>/dev/null || true
          ls -la main.exe whisper.dll

      - name: Lint & format check
        run: |
          npm run lint
          npm run format:check

      - name: Build unpacked app
        run: npx electron-builder --win --x64 --dir --publish never

      - name: Run smoke tests
        shell: bash
        run: bash scripts/smoke-test.sh win
